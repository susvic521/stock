<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國泰證券損益試算工具</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 24px 20px;
        }
        h2 {
            text-align: center;
            font-size: 1.25rem;
            margin: 0 0 16px 0;
            color: #006039;
            font-weight: 700;
        }
        /* 模式切換按鈕 */
        .tab-group {
            display: flex;
            background-color: #f0f2f5;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #006039;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fafafa;
        }
        input:focus, select:focus {
            border-color: #006039;
            background-color: #ffffff;
        }
        .result-card {
            margin-top: 20px;
            background: #ffffff;
            border: 1px solid #edf0f2;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            background: #f8faf9;
            font-size: 0.85rem;
            color: #888;
            border-bottom: 1px solid #edf0f2;
            font-weight: 600;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 16px;
            border-bottom: 1px solid #f2f4f6;
            font-size: 0.92rem;
        }
        .row:last-child {
            border-bottom: none;
        }
        .row.highlight {
            background-color: #fbfcfb;
        }
        .row.total {
            background: #eef7f2;
            padding: 14px 16px;
        }
        .label-name {
            color: #444;
        }
        .value {
            font-weight: 600;
            color: #222;
            text-align: right;
        }
        .positive {
            color: #d32f2f; /* 紅色（賺） */
        }
        .negative {
            color: #2e7d32; /* 綠色（賠） */
        }
        .hint {
            font-size: 0.75rem;
            color: #999;
            text-align: center;
            margin-top: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>國泰證券損益試算</h2>
    
    <!-- 模式切換：一般買賣 / 現股當沖 -->
    <div class="tab-group">
        <button class="tab-btn active" id="btn-normal">一般買賣</button>
        <button class="tab-btn" id="btn-daytrade">現股當沖</button>
    </div>

    <!-- 輸入欄位 -->
    <div class="form-grid">
        <div class="input-group">
            <label for="buyPrice">買進單價</label>
            <input type="number" id="buyPrice" placeholder="例: 19.5" step="any">
        </div>

        <div class="input-group">
            <label for="sellPrice">賣出單價</label>
            <input type="number" id="sellPrice" placeholder="例: 20.0" step="any">
        </div>

        <div class="input-group">
            <label for="shares">股數</label>
            <input type="number" id="shares" placeholder="預設 1000 股" step="1">
        </div>

        <div class="input-group">
            <label for="discount">手續費折扣</label>
            <select id="discount">
                <option value="0.28" selected>2.8 折（國泰電子預設）</option>
                <option value="0.20">2.0 折</option>
                <option value="0.60">6.0 折</option>
                <option value="1.00">無折扣 (10折)</option>
            </select>
        </div>
    </div>

    <!-- 試算結果表單 -->
    <div class="result-card">
        <div class="table-header">
            <span>項目</span>
            <span>金額</span>
        </div>
        <div class="row">
            <span class="label-name">買進金額</span>
            <span class="value" id="resBuyAmount">0 元</span>
        </div>
        <div class="row">
            <span class="label-name">賣出金額</span>
            <span class="value" id="resSellAmount">0 元</span>
        </div>
        <div class="row highlight">
            <span class="label-name">毛價差</span>
            <span class="value" id="resGrossDiff">0 元</span>
        </div>
        <div class="row">
            <span class="label-name">買入手續費</span>
            <span class="value" id="resBuyFee">0 元</span>
        </div>
        <div class="row">
            <span class="label-name">賣出手續費</span>
            <span class="value" id="resSellFee">0 元</span>
        </div>
        <div class="row">
            <span class="label-name" id="resTaxLabel">一般證交稅 (3‰)</span>
            <span class="value" id="resTax">0 元</span>
        </div>
        <div class="row total">
            <span class="label-name" style="font-weight: 700;">預估淨利</span>
            <span class="value" id="resNetProfit" style="font-size: 1.05rem;">0 元</span>
        </div>
    </div>

    <div class="hint" id="calcHint">
        * 一般買賣：精確計算手續費（無條件捨去）與一般證交稅 (3‰)。
    </div>
</div>

<script>
let currentMode = 'normal'; // 'normal' 或 'daytrade'

function initEvents() {
    document.getElementById('btn-normal').addEventListener('click', function() { setMode('normal'); });
    document.getElementById('btn-daytrade').addEventListener('click', function() { setMode('daytrade'); });

    const inputs = ['buyPrice', 'sellPrice', 'shares', 'discount'];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', calculate);
        el.addEventListener('change', calculate);
    });
}

function setMode(mode) {
    currentMode = mode;
    
    document.getElementById('btn-normal').classList.toggle('active', mode === 'normal');
    document.getElementById('btn-daytrade').classList.toggle('active', mode === 'daytrade');

    const calcHint = document.getElementById('calcHint');

    if (mode === 'normal') {
        calcHint.innerText = "* 一般買賣：扣除買賣手續費與一般證交稅 (3‰)。";
    } else {
        calcHint.innerText = "* 現股當沖：扣除買賣手續費與當沖優惠證交稅 (1.5‰)。";
    }

    calculate();
}

function calculate() {
    const buyPriceInput = document.getElementById('buyPrice').value;
    const sellPriceInput = document.getElementById('sellPrice').value;
    const sharesInput = document.getElementById('shares').value;
    
    const buyPrice = buyPriceInput === "" ? 0 : parseFloat(buyPriceInput) || 0;
    const sellPrice = sellPriceInput === "" ? 0 : parseFloat(sellPriceInput) || 0;
    const shares = sharesInput === "" ? 1000 : (parseFloat(sharesInput) || 0);
    const discount = parseFloat(document.getElementById('discount').value) || 0.28;

    // 1. 買進金額與手續費（國泰規定：小數點無條件捨去）
    const buyAmount = buyPrice * shares;
    let buyFee = buyAmount > 0 ? Math.floor(buyAmount * 0.001425 * discount) : 0;
    if (buyAmount > 0 && buyFee < 1) buyFee = 1;

    // 2. 賣出金額與手續費
    const sellAmount = sellPrice * shares;
    const grossDiff = sellAmount - buyAmount;

    let sellFee = sellAmount > 0 ? Math.floor(sellAmount * 0.001425 * discount) : 0;
    if (sellAmount > 0 && sellFee < 1) sellFee = 1;

    // 3. 證交稅（一般 3‰，當沖 1.5‰，四捨五入）
    const taxRate = currentMode === 'daytrade' ? 0.0015 : 0.003;
    const tax = Math.round(sellAmount * taxRate);

    // 4. 總成本與淨利
    const totalCostWithFee = Math.round(buyAmount + buyFee);
    const netProfit = Math.round(sellAmount - buyAmount - buyFee - sellFee - tax);
    const roi = totalCostWithFee > 0 ? ((netProfit / totalCostWithFee) * 100).toFixed(2) : "0.00";

    // 5. 渲染畫面
    document.getElementById('resBuyAmount').innerText = buyAmount.toLocaleString() + ' 元';
    document.getElementById('resSellAmount').innerText = Math.round(sellAmount).toLocaleString() + ' 元';
    
    const grossEl = document.getElementById('resGrossDiff');
    const grossSign = grossDiff > 0 ? '+' : '';
    grossEl.innerText = grossSign + Math.round(grossDiff).toLocaleString() + ' 元';

    document.getElementById('resBuyFee').innerText = buyFee.toLocaleString() + ' 元';
    document.getElementById('resSellFee').innerText = sellFee.toLocaleString() + ' 元';
    
    document.getElementById('resTaxLabel').innerText = currentMode === 'daytrade' ? '當沖證交稅 (1.5‰)' : '一般證交稅 (3‰)';
    document.getElementById('resTax').innerText = tax.toLocaleString() + ' 元';

    const netEl = document.getElementById('resNetProfit');
    if (buyPriceInput !== "" || sellPriceInput !== "") {
        const sign = netProfit > 0 ? '+' : '';
        netEl.innerText = sign + netProfit.toLocaleString() + ' 元 (' + sign + roi + '%)';
        netEl.className = 'value ' + (netProfit >= 0 ? 'positive' : 'negative');
    } else {
        netEl.innerText = '0 元';
        netEl.className = 'value';
    }
}

window.onload = function() {
    initEvents();
    calculate();
};
</script>

</body>
</html>
